
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: media_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d media_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    env_file:
      - .env
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/media_pipeline
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: 10485760
      MAX_IMAGE_PIXELS: 50000000
      ANALYSIS_MAX_EDGE: 1280
      MAX_ATTEMPTS: 3
      JOB_TIMEOUT_SECONDS: 300
      STALE_PROCESSING_GRACE_SECONDS: 60
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    env_file:
      - .env
    build: .
    command: rq worker --with-scheduler image-processing --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/media_pipeline
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: 10485760
      MAX_IMAGE_PIXELS: 50000000
      ANALYSIS_MAX_EDGE: 1280
      MAX_ATTEMPTS: 3
      JOB_TIMEOUT_SECONDS: 300
      STALE_PROCESSING_GRACE_SECONDS: 60
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reaper:
    env_file:
      - .env
    build: .
    command: python -m app.reaper
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/media_pipeline
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: 10485760
      MAX_IMAGE_PIXELS: 50000000
      ANALYSIS_MAX_EDGE: 1280
      MAX_ATTEMPTS: 3
      JOB_TIMEOUT_SECONDS: 300
      STALE_PROCESSING_GRACE_SECONDS: 60
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
